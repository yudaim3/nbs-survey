# Standalone HTTP configuration for EC2 connection tests before DNS/HTTPS setup.
# Use the same project and volume as production so data survives the switch.
name: nbs-workation
services:
  app:
    build: .
    ports:
      - "${APP_PORT:-8080}:8765"
    environment:
      PORT: "8765"
      BIND_HOST: "0.0.0.0"
      DATA_DIR: "/data"
      PUBLIC_URL: "http://${PUBLIC_HOST:?Set PUBLIC_HOST in .env.aws-test}:${APP_PORT:-8080}"
      ALLOWED_HOSTS: "127.0.0.1:8765,127.0.0.1:${APP_PORT:-8080},localhost:${APP_PORT:-8080}"
      ALLOW_ADMIN_SETUP: "false"
      SECURE_COOKIE: "false"
    volumes:
      - survey-data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
volumes:
  survey-data:
