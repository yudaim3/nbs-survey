<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>淡路島ワーケーション アンケート</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head><body><header class="top"><a class="brand" href="/">NBS <span>WORKATION</span></a><a href="/">アンケート一覧</a></header><main><div class="hero"><p class="eyebrow">参加者アンケート</p><h1 id="title">淡路島ワーケーション<br>アンケート</h1><p id="event-meta" class="eyebrow"></p><p id="intro"></p></div><div id="notice" role="status" class="notice hidden"></div><form id="survey"><section class="card"><label class="label" for="name">回答者名 <span class="optional">任意</span></label><input id="name" name="name" maxlength="100" autocomplete="name" placeholder="未入力でも回答できます"></section><nav id="steps" class="steps" aria-label="設問のセクション"></nav><div id="questions"></div><div class="actions"><button type="button" class="secondary" id="back">前へ</button><span id="progress" aria-live="polite"></span><button type="button" id="next">次へ</button></div></form><section id="review" class="card hidden"><p class="eyebrow">送信前の確認</p><h2>回答内容をご確認ください</h2><div id="review-content"></div><p id="send-error" class="error" role="alert"></p><div class="actions"><button id="edit" class="secondary">入力に戻る</button><button id="send">この内容で送信する</button></div></section><section id="success" class="card hidden" tabindex="-1"><div class="check">✓</div><h2>回答を登録しました</h2><p>ご協力ありがとうございました。回答は保存されています。</p><p id="receipt" class="hint"></p><button id="again" class="secondary">別の回答を入力する</button></section><footer>淡路島ワーケーション アンケート</footer></main></body></html>
